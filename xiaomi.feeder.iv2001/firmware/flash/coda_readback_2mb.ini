; MediaTek CODA readback — IV2001 full 2 MB (0x08000000, length 0x200000)
; Windows IoT Flash Tool / CODA only. INI readback does not work under Wine on Linux.

[INI]
Version=1.0

[Settings]
autoDetectUSB=disable
uartComPort=@COM_NAME@
downloadWithoutBattery=enable
debugLog=disable
daLoggingChannel=disable
USB2.0=disable
longPressPowerKey=disable
downloadAgentFilePath=@DA_PATH@
resetTargetAfterDisconnect=enable

[Info]
ComPorts=enable
DownloadLib=enable
DownloadAgentFile=enable
Chip=enable

[Readback]
module=Main

[Readback1]
addressType=physical
beginAddress=0x08000000
length=0x200000
filePath=@OUT_PATH@
