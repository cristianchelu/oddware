############################################################################################################
#
#  MediaTek IoT Flash Tool download config — IV2001 2 MB layout
#  Canonical addresses: spec/40-architecture/partition-layout.md
#
#  Dual-image: petfeeder_a.bin @ Bank A, petfeeder_b.bin @ Bank B (different link bases).
#  A/B control block (0x0800F000) is embedded in mt7682_bootloader.bin — no separate rom entry.
#
############################################################################################################

general:
    config_version : v2.0
    platform: MT7682

############################################################################################################
#
#  Main Region Setting
#
############################################################################################################

main_region:
    address_type: physical
    rom_list:
        - rom:
            file: mt7682_bootloader.bin
            name: BootLoader
            begin_address: 0x08002000
        - rom:
            file: petfeeder_a.bin
            name: ROM_A
            begin_address: 0x08012000
        - rom:
            file: petfeeder_b.bin
            name: ROM_B
            begin_address: 0x08100000
        - rom:
            file: mt768x_default_PerRate_TxPwr.bin
            name: PWR
            begin_address: 0x081FE000
