<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PetFeeder</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#111;color:#eee}
h1,h2{font-size:1.1rem;margin:12px 0 8px}section{border:1px solid #333;border-radius:8px;padding:10px;margin:12px 0}
#status{font-size:.85rem;color:#aaa;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{font-size:.85rem}input,select,button{padding:6px 8px;border-radius:4px;border:1px solid #444;background:#222;color:#eee}
button{cursor:pointer}button.primary{background:#2a6}table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{border-bottom:1px solid #333;padding:4px;text-align:left}.pill{display:inline-block;padding:2px 6px;border-radius:4px;background:#333;font-size:.75rem}
.err{color:#f66}.ok{color:#6c6}
</style>
</head>
<body>
<h1>PetFeeder</h1>
<div id="status">Loading…</div>
<section>
<h2>Dispense</h2>
<div class="row">
<label>Grams <input id="dispG" type="number" min="5" max="150" value="30" style="width:4em"></label>
<button class="primary" id="dispBtn">Feed now</button>
</div>
</section>
<section>
<h2>Schedule</h2>
<div class="row">
<label><input type="checkbox" id="schedEn"> Enabled</label>
<label><input type="checkbox" id="todayEn"> Today</label>
<button id="refreshBtn">Refresh</button>
</div>
<div id="next"></div>
<table id="slots"><thead><tr><th>Time</th><th>Days</th><th>g</th><th>State</th><th></th></tr></thead><tbody></tbody></table>
<h2>Add / edit slot</h2>
<div class="row">
<input id="slotH" type="number" min="0" max="23" placeholder="HH" style="width:3em">
<input id="slotM" type="number" min="0" max="59" placeholder="MM" style="width:3em">
<input id="slotG" type="number" min="5" max="150" value="30" style="width:4em">
<label><input type="checkbox" id="slotOn" checked> on</label>
</div>
<div class="row" id="days"></div>
<button class="primary" id="saveSlot">Save slot</button>
</section>
<section>
<h2>Settings</h2>
<div class="row">
<label>Feed mode
<select id="feedMode"><option value="open_loop">open_loop</option><option value="compensated">compensated</option></select>
</label>
<button id="saveMode">Save mode</button>
</div>
<div class="row">
<label>TZ rule <input id="tzRule" size="24" placeholder="UTC0"></label>
<button id="saveTz">Save TZ</button>
</div>
</section>
<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const dayBox=document.getElementById('days');
DAYS.forEach((d,i)=>{const l=document.createElement('label');l.innerHTML=`<input type=checkbox class=day value=${i}> ${d}`;dayBox.appendChild(l);});
function msg(t,ok){const s=document.getElementById('status');s.textContent=t;s.className=ok?'ok':'err';}
async function api(method,path,body){
  const o={method};if(body!==undefined){o.headers={'Content-Type':body.startsWith('{')?'application/json':'text/plain'};o.body=body;}
  const r=await fetch(path,o);const t=await r.text();try{return JSON.parse(t)}catch(e){return t;}
}
function daysToMask(){
  let m=0;document.querySelectorAll('.day:checked').forEach(c=>m|=1<<+c.value);return m;
}
function maskToDays(mask){
  const a=[];for(let i=0;i<7;i++)if(mask&(1<<i))a.push(i);return a;
}
function renderDays(mask){
  document.querySelectorAll('.day').forEach(c=>{c.checked=!!(mask&(1<<c.value));});
}
async function loadStatus(){
  const st=await api('GET','/api/status');
  const nx=st.next?`Next: ${st.next.hour}:${String(st.next.min).padStart(2,'0')} ${st.next.g}g in ${st.next.in_min}m`:'No upcoming feed';
  document.getElementById('next').textContent=nx;
  document.getElementById('schedEn').checked=!!st.schedule_enabled;
  document.getElementById('todayEn').checked=!!st.today_enabled;
  msg(`${st.time_synced?st.local_time:'time not synced'} | hopper ${st.hopper} | busy ${st.dispense_busy}`,true);
}
async function loadSchedule(){
  const doc=await api('GET','/api/schedule/state');
  const tb=document.querySelector('#slots tbody');tb.innerHTML='';
  (doc.schedule||[]).forEach(s=>{
    const tr=document.createElement('tr');
    const t=s.time.split(':');
    const days=(s.repeat_days||[]).map(d=>DAYS[d][0]).join('');
    tr.innerHTML=`<td>${s.time}</td><td>${days}</td><td>${s.g}</td><td><span class=pill>${s.state}</span></td>
    <td><button data-del="${t[0]}:${t[1]}">Del</button> <button data-skip="${t[0]}:${t[1]}">Skip</button></td>`;
    tr.querySelector('[data-del]').onclick=async()=>{await api('POST','/api/schedule/delete',JSON.stringify({hour:+t[0],min:+t[1]}));loadAll();};
    tr.querySelector('[data-skip]').onclick=async()=>{await api('POST','/api/schedule/skip',JSON.stringify({hour:+t[0],min:+t[1],skip:true}));loadAll();};
    tb.appendChild(tr);
  });
}
async function loadMode(){const m=await api('GET','/api/feed/mode');document.getElementById('feedMode').value=m.trim?m.trim():m;}
async function loadConfig(){const c=await api('GET','/api/config');if(c.tz_rule)document.getElementById('tzRule').value=c.tz_rule;}
async function loadAll(){await loadStatus();await loadSchedule();await loadMode();await loadConfig();}
document.getElementById('refreshBtn').onclick=loadAll;
document.getElementById('dispBtn').onclick=async()=>{const g=+document.getElementById('dispG').value;const r=await api('POST','/api/dispense',JSON.stringify({g}));msg(r.ok?'Dispense queued':'Dispense failed: '+r.error,!!r.ok);};
document.getElementById('schedEn').onchange=async e=>{await api('POST','/api/schedule/enable',JSON.stringify({enabled:e.target.checked}));loadAll();};
document.getElementById('todayEn').onchange=async e=>{await api('POST','/api/schedule/today',JSON.stringify({enabled:e.target.checked}));loadAll();};
document.getElementById('saveSlot').onclick=async()=>{
  const mask=daysToMask();if(!mask){msg('Pick at least one day',false);return;}
  const body={hour:+document.getElementById('slotH').value,min:+document.getElementById('slotM').value,
    repeat_days:maskToDays(mask),g:+document.getElementById('slotG').value,enabled:document.getElementById('slotOn').checked};
  const r=await api('POST','/api/schedule/set',JSON.stringify(body));msg(r.ok?'Slot saved':r.error,!!r.ok);loadAll();
};
document.getElementById('saveMode').onclick=async()=>{const v=document.getElementById('feedMode').value;const r=await api('POST','/api/feed/mode',v);msg(r.ok?'Mode saved':r.error,!!r.ok);};
document.getElementById('saveTz').onclick=async()=>{const r=await api('POST','/api/config',JSON.stringify({tz_rule:document.getElementById('tzRule').value}));msg(r.ok?'TZ saved':r.error,!!r.ok);};
renderDays(127);loadAll();setInterval(loadStatus,5000);
</script>
</body>
</html>
